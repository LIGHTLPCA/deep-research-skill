name: 🐛 Bug Report
description: File a bug report to help us improve light-lpca-deep-research.
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: Thank you for taking the time to report a bug!
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Clear and concise description of what the bug is.
      placeholder: Describe the unexpected behavior...
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps To Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Run command '...'
        2. Inspect output
        3. See error
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment Info
      description: OS version, Python version, library version.
      placeholder: |
        - OS: Windows / Linux / macOS
        - Python version: 3.10
        - Package version: 0.1.0
    validations:
      required: false
